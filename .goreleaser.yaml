# goreleaser configuration (https://goreleaser.com/customization/), run by
# .github/workflows/release.yml on v* tags:
#
#   - one static build per program for linux/amd64, linux/arm64,
#     freebsd/amd64 and openbsd/amd64
#   - reproducible tar.gz archives with the licence, documentation and the
#     sample configuration template
#   - deb and rpm packages with the same contents as packages/nfpm/nfpm.yaml
#   - sha256 checksums, syft SBOMs and a cosign keyless signature of the
#     checksum file
#
# Locally: "make release-check" validates this file and
# "make release-snapshot" builds everything into dist/ without publishing.
#
# Adding a program: append a builds entry like the five
# below; the archives and packages include every build automatically.

version: 2

project_name: greyd

env:
  - CGO_ENABLED=0

before:
  hooks:
    # The sample configuration, init scripts and systemd units under etc/
    # and packages/systemd/ are generated by make from .in templates and
    # must exist with the package paths before the nfpms section runs.
    # stage.sh runs "make -B conf" with prefix=/usr sysconfdir=/etc
    # localstatedir=/var/lib and the /var/empty pidfiles (the values of
    # PKG_MAKEVARS in packages/release.mk), then copies the results and
    # the gzipped manual pages into packages/nfpm/stage/.
    - sh packages/nfpm/stage.sh

builds:
  # The first entry carries the shared settings (anchor); the ldflags
  # mirror LDFLAGS in the Makefile with the package paths (DEFAULT_CONFIG,
  # GREYD_PIDFILE, GREYLOGD_PIDFILE). The other entries merge it and only
  # override the program specific keys.
  - &build_defaults
    id: greyd
    main: ./cmd/greyd
    binary: greyd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
      - goos: openbsd
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/mikey-austin/greyd-golang/internal/version.Version={{ .Version }}
        -X github.com/mikey-austin/greyd-golang/internal/version.DefaultConfig=/etc/greyd/greyd.conf
        -X github.com/mikey-austin/greyd-golang/internal/version.GreydPidfile=/var/empty/greyd/greyd.pid
        -X github.com/mikey-austin/greyd-golang/internal/version.GreylogdPidfile=/var/empty/greylogd/greylogd.pid
    mod_timestamp: "{{ .CommitTimestamp }}"
  - <<: *build_defaults
    id: greydb
    main: ./cmd/greydb
    binary: greydb
  - <<: *build_defaults
    id: greyd-setup
    main: ./cmd/greyd-setup
    binary: greyd-setup
  - <<: *build_defaults
    id: greylogd
    main: ./cmd/greylogd
    binary: greylogd
  - <<: *build_defaults
    id: greyd-monitor
    main: ./cmd/greyd-monitor
    binary: greyd-monitor

archives:
  - id: tarballs
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    wrap_in_directory: true
    # Fixed mtimes keep the archives byte for byte reproducible.
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: COPYING
        dst: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: INSTALL
        info:
          mtime: "{{ .CommitDate }}"
      - src: doc/*.8
        info:
          mtime: "{{ .CommitDate }}"
      - src: doc/*.5
        info:
          mtime: "{{ .CommitDate }}"
      - src: etc/greyd.conf.in
        info:
          mtime: "{{ .CommitDate }}"

# deb and rpm packages for the linux builds. Keep the contents in step
# with packages/nfpm/nfpm.yaml (which additionally lists the programs;
# here goreleaser adds every build to bindir itself).
nfpms:
  - id: packages
    package_name: greyd
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: greyd.org
    homepage: https://greyd.org
    maintainer: Mikey Austin <mikey@greyd.org>
    license: ISC
    section: mail
    priority: optional
    description: |
      Greylisting and blacklisting daemon.
      greyd is a spam deferral daemon derived from OpenBSD's spamd. It sits in
      front of a mail server, greylists unknown senders, tarpits blacklisted
      hosts and keeps the firewall's whitelist up to date. This package
      contains greyd, the greydb database tool, the greyd-setup blacklist
      loader and the greylogd whitelist logger, with the netfilter, pf and
      dummy firewall drivers and the bolt, sqlite, mysql, postgresql and
      memory database drivers compiled in.
    formats:
      - deb
      - rpm
    bindir: /usr/sbin
    dependencies:
      - curl
    contents:
      - src: packages/nfpm/stage/etc/greyd.conf
        dst: /etc/greyd/greyd.conf
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/etc/greyd.docker.conf
        dst: /etc/greyd/greyd.docker.conf
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/etc/greyd.redhat-init
        dst: /etc/greyd/greyd.redhat-init
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/etc/greylogd.redhat-init
        dst: /etc/greyd/greylogd.redhat-init
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/etc/greyd.debian-init
        dst: /etc/greyd/greyd.debian-init
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/etc/greylogd.debian-init
        dst: /etc/greyd/greylogd.debian-init
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/systemd/*
        dst: /usr/lib/systemd/system/
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/man/man8/*.gz
        dst: /usr/share/man/man8/
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/man/man5/*.gz
        dst: /usr/share/man/man5/
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/doc/README.md
        dst: /usr/share/doc/greyd/README.md
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/doc/COPYING
        dst: /usr/share/doc/greyd/COPYING
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/doc/AUTHORS
        dst: /usr/share/doc/greyd/AUTHORS
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/doc/NEWS
        dst: /usr/share/doc/greyd/NEWS
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/doc/ChangeLog
        dst: /usr/share/doc/greyd/ChangeLog
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/doc/mysql_schema.sql
        dst: /usr/share/doc/greyd/mysql_schema.sql
        file_info:
          mode: 0644
      - src: packages/nfpm/stage/doc/postgresql_schema.sql
        dst: /usr/share/doc/greyd/postgresql_schema.sql
        file_info:
          mode: 0644
    scripts:
      postinstall: packages/nfpm/scripts/postinstall.sh
      preremove: packages/nfpm/scripts/preremove.sh
      postremove: packages/nfpm/scripts/postremove.sh
    rpm:
      group: Applications/Internet
      summary: Greylisting and blacklisting daemon
      compression: gzip
    deb:
      compression: gzip

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Software bills of materials, one per archive and package, produced with
# syft (installed in the workflow by anchore/sbom-action/download-syft).
sboms:
  - id: archive-sboms
    artifacts: archive
  - id: package-sboms
    artifacts: package

# Keyless (OIDC) cosign signature of the checksum file; the workflow grants
# id-token: write for it. Verify with:
#   cosign verify-blob --certificate checksums.txt.pem \
#       --signature checksums.txt.sig \
#       --certificate-identity-regexp 'https://github.com/mikey-austin/greyd-golang/' \
#       --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#       checksums.txt
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    output: true
    args:
      - sign-blob
      - --yes
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs?:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: mikey-austin
    name: greyd-golang
  prerelease: auto
  footer: |
    The checksums.txt file is signed with cosign (keyless); the .sig and
    .pem files next to it verify it, and each archive and package has a
    syft SBOM (.sbom.json). See INSTALL, "Packaging and releases".
