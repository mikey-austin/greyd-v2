# doc/greyd.conf.5.md, DATABASE SECTION: every documented driver option
# in one section (bolt, sqlite, mysql, postgresql and memory).
section database {
    driver  = "postgresql"
    path    = "/var/db/greyd"
    db_name = "greyd.db"
    host    = "localhost"
    port    = 5432
    name    = "greyd"
    user    = "greyd"
    pass    = "secret"
    socket  = "/var/run/postgresql/.s.PGSQL.5432"
}
