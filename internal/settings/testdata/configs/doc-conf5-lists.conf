# doc/greyd.conf.5.md, DESCRIPTION: blacklist/whitelist skeletons. The
# "..." bodies of the manual are replaced by the fields a list needs.
blacklist blacklistname {
    message = "Your address %A is listed"
    method  = "file"
    file    = "/var/lib/greyd/blacklistname"
}

whitelist whitelistname {
    method = "file"
    file   = "/var/lib/greyd/whitelistname"
}
