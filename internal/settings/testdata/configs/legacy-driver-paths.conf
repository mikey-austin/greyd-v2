# Driver values as written by installations of the C implementation:
# shared object paths and libtool archives, plus the retired Berkeley DB
# drivers, all of which core.NormalizeDriver maps to compiled-in names.
section firewall {
    driver = "/usr/lib/greyd/greyd_netfilter.so"
}

section database {
    driver  = "/usr/lib/greyd/greyd_bdb_sql.so"
    path    = "/var/greyd"
    db_name = "greyd.db"
}
