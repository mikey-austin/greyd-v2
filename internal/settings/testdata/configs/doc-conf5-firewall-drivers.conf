# doc/greyd.conf.5.md, FIREWALL SECTION: every documented driver option
# in one section (netfilter, pf and ipfw). Firewall options are driver
# specific and are never reported as unknown by the loader.
section firewall {
    driver         = "netfilter"
    max_elements   = 200000
    hash_size      = 1048576
    track_outbound = 1
    inbound_group  = 155
    outbound_group = 255
    pfdev_path     = "/dev/pf"
    pfctl_path     = "/sbin/pfctl"
    pflog_if       = "pflog0"
    ipfw_path      = "/sbin/ipfw"
    ipfw_log_if    = "ipfw0"
    net_if         = "em0"
}
