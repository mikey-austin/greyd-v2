# doc/greyd.conf.5.md, DESCRIPTION: assignment syntax examples.
# "variable" is not a real option, so the loader warns about it (see
# corpus_test.go expectedWarnings).

# A string value.
variable = "value"

# A number value.
variable = 10  # Another comment.

# A list value may contain strings or numbers.
# Trailing commas are allowed.
variable = [ 10, "value", ]
