name: Coverage

# Unit test coverage with a minimum total; "make coverage" runs the same
# check locally (packages/release.mk).

on: [push, pull_request]

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  COVER_MIN: '50'

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: test with coverage
        run: go test -coverprofile=cover.out -covermode=atomic ./...

      - name: report
        run: |
          go tool cover -func=cover.out | tail -1
          go tool cover -html=cover.out -o coverage.html
          {
            echo '### Coverage'
            echo
            echo '```'
            go tool cover -func=cover.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            cover.out
            coverage.html
          if-no-files-found: error

      - name: enforce minimum
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{ print $NF }' | tr -d '%')
          echo "total coverage: ${total}% (minimum ${COVER_MIN}%)"
          awk -v t="$total" -v m="$COVER_MIN" 'BEGIN {
              if (t + 0 < m + 0) {
                  printf "coverage %.1f%% is below the %d%% minimum\n", t, m
                  exit 1
              }
          }'
