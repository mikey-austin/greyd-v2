name: Nightly soak

# Runs greyd under a steady load for half an hour in the privileged
# integration container and checks memory, descriptors, counters and the
# scanner stay healthy (packages/integration/soak.sh). Scheduled nightly;
# can also be started by hand with a different length.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'soak length in minutes'
        default: '30'

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: soak
        run: make test-soak SOAK_MINUTES=${{ github.event.inputs.minutes || '30' }}
      - name: upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-samples-${{ github.run_id }}
          path: soak.csv
          if-no-files-found: warn
