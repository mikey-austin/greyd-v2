name: Integration

on: [push, pull_request]

jobs:
  # Full netfilter flow (DNAT + conntrack, ipset, NFLOG, greyd-setup over the
  # unix configuration socket) inside a privileged container; see
  # packages/integration/run-linux.sh.
  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: integration harness (privileged docker)
        run: make test-integration

  # Vet, the whole test tree (pf adapter, pledge sandbox), a pf/pledge smoke
  # test and the sync protocol compatibility test against the spamd of the
  # OpenBSD base system; see packages/integration/run-openbsd*.sh.
  openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: OpenBSD vet, test and smoke test
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.7'
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            pkg_add -I go || true
          # The packaged Go may lag behind go.mod: the official openbsd-amd64
          # tarball of the go.mod toolchain version is installed when the
          # packaged one differs, so GOTOOLCHAIN=local never has to refuse.
          run: |
            set -e
            export GOFLAGS=-buildvcs=false GOTOOLCHAIN=local
            want=$(sed -n 's/^toolchain go//p' go.mod)
            [ -n "$want" ] || want=$(sed -n 's/^go //p' go.mod)
            have=$(go version 2>/dev/null | sed -n 's/^go version go\([0-9.]*\).*/\1/p')
            echo "go.mod wants go$want, packaged go is '${have:-none}'"
            if [ "$have" != "$want" ]; then
              echo "installing go$want from go.dev"
              ftp -o /tmp/go.tgz "https://go.dev/dl/go$want.openbsd-amd64.tar.gz"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf /tmp/go.tgz
              ln -sf /usr/local/go/bin/go /usr/local/bin/go
              ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
              hash -r
            fi
            go version
            echo "== go vet"
            go vet -unreachable=false ./...
            echo "== go test"
            go test ./...
            echo "== pf / pledge smoke test"
            sh packages/integration/run-openbsd.sh
            echo "== spamd sync compatibility"
            sh packages/integration/run-openbsd-sync.sh

  # The ipfw firewall driver in a FreeBSD VM: vet, the test tree and the
  # smoke test in packages/integration/run-freebsd.sh.
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: FreeBSD vet, test and ipfw smoke test
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            pkg install -y go || true
          run: |
            set -e
            export GOFLAGS=-buildvcs=false GOTOOLCHAIN=local
            want=$(sed -n 's/^toolchain go//p' go.mod)
            [ -n "$want" ] || want=$(sed -n 's/^go //p' go.mod)
            have=$(go version 2>/dev/null | sed -n 's/^go version go\([0-9.]*\).*/\1/p')
            echo "go.mod wants go$want, packaged go is '${have:-none}'"
            if [ "$have" != "$want" ]; then
              echo "installing go$want from go.dev"
              fetch -o /tmp/go.tgz "https://go.dev/dl/go$want.freebsd-amd64.tar.gz"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf /tmp/go.tgz
              ln -sf /usr/local/go/bin/go /usr/local/bin/go
              ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
              hash -r
            fi
            go version
            echo "== go vet"
            go vet -unreachable=false ./...
            echo "== go test"
            go test ./...
            echo "== ipfw smoke test"
            sh packages/integration/run-freebsd.sh

  # The npf firewall driver in a NetBSD VM: vet, the test tree and the
  # smoke test in packages/integration/run-netbsd.sh. Informational until
  # seen green.
  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: NetBSD vet, test and npf smoke test
        uses: vmactions/netbsd-vm@v1
        with:
          release: '10.1'
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            /usr/sbin/pkg_add -I go || true
          run: |
            set -e
            export GOFLAGS=-buildvcs=false GOTOOLCHAIN=local
            want=$(sed -n 's/^toolchain go//p' go.mod)
            [ -n "$want" ] || want=$(sed -n 's/^go //p' go.mod)
            have=$(go version 2>/dev/null | sed -n 's/^go version go\([0-9.]*\).*/\1/p')
            echo "go.mod wants go$want, packaged go is '${have:-none}'"
            if [ "$have" != "$want" ]; then
              echo "installing go$want from go.dev"
              ftp -o /tmp/go.tgz "https://go.dev/dl/go$want.netbsd-amd64.tar.gz"
              rm -rf /usr/local/go
              mkdir -p /usr/local
              tar -C /usr/local -xzf /tmp/go.tgz
              ln -sf /usr/local/go/bin/go /usr/bin/go
              ln -sf /usr/local/go/bin/gofmt /usr/bin/gofmt
              hash -r
            fi
            go version
            echo "== go vet"
            go vet -unreachable=false ./...
            echo "== go test"
            go test ./...
            echo "== npf smoke test"
            sh packages/integration/run-netbsd.sh

  # The pf firewall driver in a DragonFly BSD VM with the bolt database
  # (the embedded SQLite has no DragonFly port). Go comes from dports;
  # any 1.25.x satisfies the go directive under GOTOOLCHAIN=local.
  # Informational until seen green.
  dragonfly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: DragonFly vet, test and pf smoke test
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.0'
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            # dports ships several Go versions; take the newest that
            # satisfies the go.mod floor. The default "go" package lags.
            pkg install -y go125 || pkg install -y go124 || pkg install -y go || true
          run: |
            set -e
            export GOFLAGS=-buildvcs=false GOTOOLCHAIN=local
            # Prefer a versioned Go binary (go125/go124) over the default.
            for c in go125 go124 go; do
              if command -v "$c" >/dev/null 2>&1; then GO=$c; break; fi
            done
            want=$(sed -n 's/^go //p' go.mod)
            have=$("$GO" version 2>/dev/null | sed -n 's/^go version go\([0-9.]*\).*/\1/p')
            echo "go.mod needs >= go$want; dports $GO is '${have:-none}'"
            # DragonFly is not published on go.dev, so if dports has no Go
            # new enough this best-effort job cannot run the suite; say so
            # and stop cleanly (the job is continue-on-error).
            major_ok=$(awk -v h="${have:-0}" -v w="$want" 'BEGIN{split(h,a,".");split(w,b,".");print (a[1]>b[1] || (a[1]==b[1] && a[2]>=b[2])) ? 1 : 0}')
            if [ "$major_ok" != 1 ]; then
              echo "DragonFly dports has no Go >= $want yet; skipping the DragonFly suite."
              exit 0
            fi
            "$GO" version
            echo "== go vet"
            "$GO" vet -unreachable=false ./...
            echo "== go test"
            "$GO" test ./...
            echo "== pf smoke test"
            GREYD_GO="$GO" sh packages/integration/run-dragonfly.sh
