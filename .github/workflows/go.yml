name: Go CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: build
      run: make build
    - name: test
      run: make test
    - name: race
      run: make test-race
    - name: cross-compile checks
      run: |
        GOOS=openbsd GOARCH=amd64 go vet -unreachable=false ./...
        GOOS=freebsd GOARCH=amd64 go vet -unreachable=false ./...
