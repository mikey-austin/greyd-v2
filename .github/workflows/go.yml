name: Go CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
    - name: build
      run: make build
    - name: test
      run: make test
    - name: race
      run: make test-race
    - name: fuzz (smoke)
      run: make fuzz FUZZTIME=5s
    - name: cross-compile checks
      run: |
        GOOS=openbsd GOARCH=amd64 go vet -unreachable=false ./...
        GOOS=freebsd GOARCH=amd64 go vet -unreachable=false ./...
        GOOS=netbsd GOARCH=amd64 go vet -unreachable=false ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
    # Configuration is in .golangci.yml (v2 format). The version is pinned
    # to the one "make tools" installs, so CI and developers see the same
    # findings; bump both together.
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.5.0
    - name: govulncheck
      uses: golang/govulncheck-action@v1
      with:
        go-version-input: '1.25'
        go-package: ./...
