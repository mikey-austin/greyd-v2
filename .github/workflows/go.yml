name: Go CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: build
      run: make build
    - name: test
      run: make test
    - name: race
      run: make test-race
    - name: cross-compile checks
      run: |
        GOOS=openbsd GOARCH=amd64 go vet -unreachable=false ./...
        GOOS=freebsd GOARCH=amd64 go vet -unreachable=false ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    # Configuration is in .golangci.yml (v2 format; action v7 expects v2).
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: latest
    - name: govulncheck
      uses: golang/govulncheck-action@v1
      with:
        go-version-input: '1.25'
        go-package: ./...
